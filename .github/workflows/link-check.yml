name: Check external links
on:
  workflow_dispatch:
  schedule:
    - cron: '13 10 * * 0'
jobs:
  check-links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:links
