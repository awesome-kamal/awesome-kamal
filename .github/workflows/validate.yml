name: Validate directory
on:
  pull_request:
    paths: ['resources/**', 'catalog.json', 'README.md', 'scripts/**', '.github/workflows/validate.yml']
  push:
    branches: [main]
    paths: ['resources/**', 'catalog.json', 'README.md', 'scripts/**', '.github/workflows/validate.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
